[project]
name = "so101-reach"
version = "0.2.0"
description = "SO-101 goal-conditioned RL reaching and language-agent control"
requires-python = ">=3.12,<3.13"
dependencies = [
  "mjlab==1.6.0",
  "onnxruntime>=1.20,<2",
  "numpy>=2,<3",
  "scipy>=1.15,<2",
  "huggingface_hub>=0.30,<3",
  "matplotlib>=3.8,<4",
  "pandas>=2,<4",
]

[project.optional-dependencies]
agent = [
  "opencv-python-headless>=4.10,<6",
  "feetech-servo-sdk==1.0.0",
  "openai>=1.60,<4",
  "Pillow>=10",
  "glfw>=2.7,<3",
]
real = [
  "so101-reach[agent]",
  "pyrealsense2>=2.55,<3",
  "transformers>=5.0,<6",
]
manipulation = ["so101-reach[real]"]

[project.entry-points."mjlab.tasks"]
so101_reach = "so101_reach.tasks"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
